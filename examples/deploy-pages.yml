# Example: build a Vite site and deploy it to GitHub Pages with analytics injected.
# Copy to .github/workflows/deploy.yml in your project.
#
# Requires:
#   - Settings → Pages → Source: GitHub Actions
#   - A repository variable named ANALYTICS_ID (optional; without it, no tracking is added)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Inject analytics
        run: npx pages-analytics inject dist
        env:
          ANALYTICS_PROVIDER: ga4 # or plausible
          ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
